name: Build ISTANU APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ISTANU-main.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip ISTANU-main.zip

      - name: Build APK
        run: |
          cd ISTANU
          gradle assembleDebug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISTANU-APK
          path: ISTANU/app/build/outputs/apk/debug/*.apk
